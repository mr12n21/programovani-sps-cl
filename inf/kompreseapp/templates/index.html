<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompresní aplikace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 0.75rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .method-btn {
            padding: 0.75rem 1rem;
            border: 2px solid #334155;
            border-radius: 8px;
            background: transparent;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .method-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
        }

        .method-btn.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .compress-btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .compress-btn:hover { opacity: 0.9; }
        .compress-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #results {
            display: none;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .result-header h2 {
            font-size: 1.1rem;
            color: #38bdf8;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-ok {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .badge-fail {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .stat {
            background: #0f172a;
            border-radius: 8px;
            padding: 0.75rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .data-block {
            background: #0f172a;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.85rem;
            word-break: break-all;
            max-height: 250px;
            overflow-y: auto;
        }

        .data-block-label {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 0.4rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid #1e293b;
        }

        th {
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        td { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.85rem; }

        .match-line {
            margin-top: 0.75rem;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .methods { grid-template-columns: 1fr; }
            .stat-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kompresní aplikace</h1>
        <p class="subtitle">Shannon-Fano &bull; RLE &bull; LZW</p>

        <div class="card">
            <label for="inputText">Vstupní text</label>
            <textarea id="inputText" placeholder="Zadejte text ke kompresi...">AAABBBCCCDDDEEE</textarea>
        </div>

        <div class="card">
            <label>Algoritmus</label>
            <div class="methods">
                <button class="method-btn active" data-method="shannon-fano">Shannon-Fano</button>
                <button class="method-btn" data-method="rle">RLE</button>
                <button class="method-btn" data-method="lzw">LZW</button>
            </div>
            <button class="compress-btn" id="compressBtn">Komprimovat</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        let selectedMethod = 'shannon-fano';

        document.querySelectorAll('.method-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMethod = btn.dataset.method;
            });
        });

        document.getElementById('compressBtn').addEventListener('click', async () => {
            const text = document.getElementById('inputText').value;
            if (!text.trim()) {
                alert('Zadejte text ke kompresi.');
                return;
            }

            const btn = document.getElementById('compressBtn');
            btn.disabled = true;
            btn.textContent = 'Zpracovávám...';

            try {
                const res = await fetch('/compress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, method: selectedMethod })
                });

                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }

                renderResults(data);
            } catch (e) {
                alert('Chyba při komunikaci se serverem.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Komprimovat';
            }
        });

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function renderResults(data) {
            const el = document.getElementById('results');
            el.style.display = 'block';

            const matchBadge = data.match
                ? '<span class="badge badge-ok">Shoda ✓</span>'
                : '<span class="badge badge-fail">Neshoda ✗</span>';

            let html = '<div class="card">';
            html += `<div class="result-header"><h2>Výsledek: ${esc(data.method.toUpperCase())}</h2>${matchBadge}</div>`;

            if (data.method === 'shannon-fano') {
                html += `
                    <div class="stat-grid">
                        <div class="stat">
                            <div class="stat-value">${data.original_bits}</div>
                            <div class="stat-label">Originál (bitů)</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${data.encoded_bits}</div>
                            <div class="stat-label">Komprese (bitů)</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${data.ratio}%</div>
                            <div class="stat-label">Poměr</div>
                        </div>
                    </div>

                    <div class="data-block-label">Kódovací tabulka</div>
                    <div class="data-block">
                        <table>
                            <tr><th>Znak</th><th>Kód</th></tr>
                            ${data.table.map(r => `<tr><td>'${esc(r.znak)}'</td><td>${esc(r.kod)}</td></tr>`).join('')}
                        </table>
                    </div>

                    <div class="data-block-label">Zakódovaný řetězec (bity)</div>
                    <div class="data-block">${esc(data.encoded)}</div>

                    <div class="data-block-label">Dekomprimovaný text</div>
                    <div class="data-block">${esc(data.decompressed)}</div>
                `;

            } else if (data.method === 'rle') {
                html += `
                    <div class="stat-grid">
                        <div class="stat">
                            <div class="stat-value">${data.original_len}</div>
                            <div class="stat-label">Originál (znaků)</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${data.compressed_len}</div>
                            <div class="stat-label">Komprese (znaků)</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${data.ratio}%</div>
                            <div class="stat-label">Poměr</div>
                        </div>
                    </div>

                    <div class="data-block-label">Komprimovaný text</div>
                    <div class="data-block">${esc(data.compressed)}</div>

                    <div class="data-block-label">Dekomprimovaný text</div>
                    <div class="data-block">${esc(data.decompressed)}</div>
                `;

            } else if (data.method === 'lzw') {
                html += `
                    <div class="stat-grid">
                        <div class="stat">
                            <div class="stat-value">${data.original.length}</div>
                            <div class="stat-label">Originál (znaků)</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${data.indices_count}</div>
                            <div class="stat-label">Indexů</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${data.dict_total}</div>
                            <div class="stat-label">Slovník (položek)</div>
                        </div>
                    </div>

                    <div class="data-block-label">Komprimované indexy</div>
                    <div class="data-block">[${data.indices.join(', ')}]</div>

                    <div class="data-block-label">Slovník (prvních ${data.dictionary.length} položek)</div>
                    <div class="data-block">
                        <table>
                            <tr><th>Řetězec</th><th>Index</th></tr>
                            ${data.dictionary.map(r => `<tr><td>'${esc(r.key)}'</td><td>${r.value}</td></tr>`).join('')}
                        </table>
                        ${data.dict_total > data.dictionary.length ? `<p style="color:#64748b;margin-top:0.5rem">…a dalších ${data.dict_total - data.dictionary.length} položek</p>` : ''}
                    </div>

                    <div class="data-block-label">Dekomprimovaný text</div>
                    <div class="data-block">${esc(data.decompressed)}</div>
                `;
            }

            html += '</div>';
            el.innerHTML = html;
            el.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
